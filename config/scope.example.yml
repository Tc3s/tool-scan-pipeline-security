schema_version: "1.0"
target: "https://target.example"
allowed_hosts:
  - "target.example"
allowed_schemes:
  - "http"
  - "https"
allowed_ports:
  - 80
  - 443
  - 8080
  - 8443
allowed_methods:
  - "GET"
  - "HEAD"
  - "OPTIONS"
  - "POST"
state_changing_methods_approved: true
allow_zap_full_scan: true
allow_unscoped_scan: false
same_origin_redirects_only: true
max_requests_per_second: 1
max_concurrency: 1
auth_allowed: false
notes:
  - "Copy this file to your run directory as scope.yml and adjust it before dry-run."
  - "Customer or production scope must be explicit before live verification."
