  tactic: "Discovery"
  confidence: 0.92
  reason: "Confirmed path traversal allows arbitrary file read access"

- match_type: finding_name
  pattern: "403 Bypass|Access Control|Authentication Bypass"
  technique_id: T1078
  technique_name: "Valid Accounts"
  tactic: "Defense Evasion"
  confidence: 0.85
  reason: "Bypassing 403/Access Control allows unauthorized access to protected resources"

- match_type: finding_name
  pattern: "Cross Site Scripting"
