# 🎯 ATT&CK Mapping Rules for ZAP/OpenVAS Findings - V1
#
# Purpose: Map vulnerability findings to MITRE ATT&CK tactics & techniques
# Format: YAML rules with match patterns (finding_name OR cwe OR cve)
# Usage: Loaded by apply_attack_mapping.py
#
# V1 baseline:
# ✅ More comprehensive rule coverage (40+ rules)
# ✅ Better confidence scoring (0.4-0.95 range)
# ✅ Improved regex patterns (case-insensitive, wildcard support)
# ✅ Better documentation & reasoning
# ✅ Support for CWE, CVE, and finding names
# ✅ Prioritized high-confidence rules first
#
# Confidence Levels:
#   0.9+ = High (trust without manual review)
#   0.7-0.89 = Medium (confidence acceptable)
#   0.5-0.69 = Low (recommend manual review)
#   <0.5 = Very Low (FYI only)

rules:

# ═══════════════════════════════════════════════════════════════════════════════
# INITIAL ACCESS (TA0001) - Entry point attacks
# ═══════════════════════════════════════════════════════════════════════════════

- match_type: cwe
  pattern: "CWE-79"  # Cross-site Scripting (XSS)
  technique_id: T1189
  technique_name: "Drive-by Compromise"
  tactic: "Initial Access"
  confidence: 0.95
  reason: "XSS enables malicious script injection & user session hijacking"

- match_type: finding_name
  pattern: "Content Security Policy.*Not Set"
  technique_id: T1189
  technique_name: "Drive-by Compromise"
  tactic: "Initial Access"
  confidence: 0.85
  reason: "Missing CSP allows arbitrary script execution via XSS/CSRF attacks"

- match_type: cwe
  pattern: "CWE-89"  # SQL Injection
  technique_id: T1190
  technique_name: "Exploit Public-Facing Application"
  tactic: "Initial Access"
  confidence: 0.92
  reason: "SQL injection enables database access, data exfiltration, and code execution"

- match_type: finding_name
  pattern: "Arbitrary File Upload"
  technique_id: T1190
  technique_name: "Exploit Public-Facing Application"
  tactic: "Initial Access"
  confidence: 0.88
  reason: "File upload vulnerability enables shell upload and command execution"

- match_type: finding_name
  pattern: "Insecure Deserialization"
  technique_id: T1190
  technique_name: "Exploit Public-Facing Application"
  tactic: "Initial Access"
  confidence: 0.85
  reason: "Unsafe deserialization allows remote code execution"

- match_type: finding_name
  pattern: "Default/Hardcoded Credentials|Default Credentials|Passwordless Login"
  technique_id: T1078
  technique_name: "Valid Accounts"
  tactic: "Initial Access"
  confidence: 0.90
  reason: "Valid/default credentials allow direct authenticated access"

- match_type: finding_name
  pattern: "Brute Force Logins With Default Credentials"
  technique_id: T1110
  technique_name: "Brute Force"
  tactic: "Credential Access"
  confidence: 0.88
  reason: "Scanner proved/default credential login path"

# ═══════════════════════════════════════════════════════════════════════════════
# WEB CONTENT & ACCESS CONTROL (CWE Specific)
# ═══════════════════════════════════════════════════════════════════════════════

- match_type: cwe
